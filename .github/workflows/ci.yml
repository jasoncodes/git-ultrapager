name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  readme-sync:
    name: README synchronization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject one-sided README changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            candidate_base="$BASE_SHA"
          else
            candidate_base="$BEFORE_SHA"
          fi

          # Root commitは自身のtree全体を検査できる。
          # Parentのあるcommitではevent baseまたはdefault branchとのmerge baseだけを使い、HEAD^で検査範囲を推測しない。
          if [[ -n "$candidate_base" && ! "$candidate_base" =~ ^0+$ ]]; then
            if ! git cat-file -e "$candidate_base^{commit}" 2>/dev/null; then
              echo "Cannot inspect the event-provided README comparison base $candidate_base." >&2
              exit 1
            fi
            changed_files="$(git diff --no-renames --name-only "$candidate_base" "$HEAD_SHA")"
          elif [[ "$EVENT_NAME" != "push" || ! "$candidate_base" =~ ^0+$ ]]; then
            echo "Cannot determine a trustworthy README comparison base from this event." >&2
            exit 1
          elif ! git cat-file -e "$HEAD_SHA^" 2>/dev/null; then
            changed_files="$(git diff-tree --root --no-renames --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
            if ! git cat-file -e "$default_ref^{commit}" 2>/dev/null; then
              echo "Cannot determine a trustworthy README comparison base: $default_ref is unavailable." >&2
              exit 1
            fi
            if ! comparison_base="$(git merge-base "$default_ref" "$HEAD_SHA" 2>/dev/null)"; then
              echo "Cannot determine a trustworthy README comparison base: $default_ref and $HEAD_SHA have no merge base." >&2
              exit 1
            fi
            if [[ "$comparison_base" == "$HEAD_SHA" ]]; then
              # BEFORE=0でdefault branch自体を初回pushした場合は、空treeからの全変更を検査する。
              # 同じHEADを指すsecondary branchの作成なら、そのbranch固有の変更はない。
              if [[ -z "$REF_NAME" ]]; then
                echo "Cannot distinguish a default-branch push from a secondary-branch push." >&2
                exit 1
              elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
                changed_files="$(git ls-tree -r --name-only "$HEAD_SHA")"
              elif [[ "$EVENT_NAME" == "push" && "$candidate_base" =~ ^0+$ ]]; then
                changed_files=""
              else
                echo "Cannot determine a trustworthy README comparison base before $HEAD_SHA." >&2
                exit 1
              fi
            else
              changed_files="$(git diff --no-renames --name-only "$comparison_base" "$HEAD_SHA")"
            fi
          fi

          english_changed=false
          japanese_changed=false
          while IFS= read -r path; do
            case "$path" in
              README.md) english_changed=true ;;
              README-ja.md) japanese_changed=true ;;
            esac
          done <<< "$changed_files"

          if [[ "$english_changed" != "$japanese_changed" ]]; then
            echo "README.md and README-ja.md must be updated together." >&2
            exit 1
          fi

  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features
