[package]
name = "git-ultrapager"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A streaming, syntax-aware Git pager"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "derive-more", "events", "use-dev-tty"] }
lru = "0.18"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
regex = "1.12"
rustix = { version = "1.1", features = ["process", "stdio", "termios"] }
serde = { version = "1.0", features = ["derive"] }
signal-hook = "0.3"
similar = { version = "3.1", default-features = false, features = ["std", "text", "unicode"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tempfile = "3.27"
thiserror = "2.0"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.46"
portable-pty = "0.9"
proptest = "1.9"
pretty_assertions = "1.4"

[profile.dev.package.aho-corasick]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
